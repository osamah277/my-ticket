<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket Dashboard V5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      body {
        font-family: Segoe UI, Arial;
        background: #FFF8E7;
        margin: 20px;
        color: #5B4636;
      }

      h1 {
        color: #A66A00;
      }

      .card,
      .stat {
        background: #FFFDF7;
        border: 1px solid #E8D9B5;
        border-radius: 10px;
        padding: 12px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        margin: 10px 0;
      }

      .btn {
        background: #D4A437;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 8px;
        margin: 5px 0;
        border: 1px solid #E8D9B5;
        border-radius: 6px;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }

      .table th {
        background: #F4E3B2;
      }

      .table th,
      .table td {
        padding: 10px;
        border: 1px solid #E8D9B5;
      }

      .detail {
        display: none;
        background: #FFFDF7;
        padding: 10px;
      }

      .note {
        background: #FAF0D7;
        padding: 6px;
        margin: 4px 0;
      }

      .reminderModal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        justify-content: center;
      }

      .box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        width: 420px;
      }
    </style>
  </head>
  <body>
    <div id="rm" class="reminderModal">
      <div class="box">
        <h3>🔔 Reminder</h3>
        <div id="rmText"></div>
        <br />
        <button class="btn" onclick="ackReminder()">OK</button>
      </div>
    </div>

    <h1>🍯 Ticket Dashboard V5</h1>

    <div class="stats">
      <div class="stat">Total <span id="t">0</span></div>
      <div class="stat">Open <span id="o">0</span></div>
      <div class="stat">Progress <span id="i">0</span></div>
      <div class="stat">Pending <span id="p">0</span></div>
      <div class="stat">Closed <span id="c">0</span></div>
    </div>

    <br />

    <div class="card">
      <h3>Create Ticket</h3>
      <input id="cn" placeholder="Customer Name" />
      <input id="tf" placeholder="Ticket From" />
      <input id="sd" placeholder="Short Description" />
      <textarea id="td" placeholder="Ticket Detail"></textarea>
      <input type="date" id="ad" />
      <select id="st">
        <option>Open</option>
        <option>Assigned</option>
        <option>In Progress</option>
        <option>Pending Customer</option>
        <option>Pending Vendor</option>
        <option>Resolved</option>
        <option>Closed</option>
      </select>
      <input type="datetime-local" id="rd" />
      <input id="rn" placeholder="Reminder Note" />
      <button class="btn" onclick="createTicket()">Create Ticket</button>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="Search Ticket #" onkeyup="render()" />
      <input type="file" id="excel" accept=".xlsx" />
      <button class="btn" onclick="importExcel()">Import Excel</button>
      <button class="btn" onclick="exportExcel()">Export Excel</button>
      <button class="btn" onclick="autoBackup()">Auto Backup Now</button>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Ticket #</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <script>
      let tickets = JSON.parse(localStorage.getItem('tickets_v5') || '[]');
      let activeReminder = null;

      function save() {
        localStorage.setItem('tickets_v5', JSON.stringify(tickets));
      }

      function nextId() {
        return 'INC' + String(tickets.length + 1).padStart(6, '0');
      }

      function createTicket() {
        tickets.push({
          ticketNumber: nextId(),
          customerName: cn.value,
          ticketFrom: tf.value,
          shortDescription: sd.value,
          ticketDetail: td.value,
          assignedDate: ad.value,
          status: st.value,
          reminderDate: rd.value,
          reminderNote: rn.value,
          reminderDone: false,
          attachments: [],
          notes: []
        });

        save();
        render();
      }

      function toggle(i) {
        let d = document.getElementById('d' + i);
        d.style.display = d.style.display === 'block' ? 'none' : 'block';
      }

      function addNote(i) {
        let v = document.getElementById('note' + i).value;

        if (!v) return;

        tickets[i].notes.push({
          date: new Date().toLocaleString(),
          text: v
        });

        save();
        render();
      }

      function addAttachment(i, e) {
        let f = e.files[0];

        if (!f) return;

        tickets[i].attachments.push({ name: f.name });
        save();
        render();
      }

      function render() {
        let s = (search.value || '').toLowerCase();
        list.innerHTML = '';

        tickets
          .filter(x => x.ticketNumber.toLowerCase().includes(s))
          .forEach((x, i) => {
            list.innerHTML += `
              <tr onclick="toggle(${i})">
                <td>${x.ticketNumber}</td>
                <td>${x.customerName}</td>
                <td>${x.status}</td>
                <td>${x.shortDescription}</td>
              </tr>
              <tr>
                <td colspan="4">
                  <div class="detail" id="d${i}">
                    <b>Detail:</b> ${x.ticketDetail}<br>
                    <b>Reminder:</b> ${x.reminderDate || ''} ${x.reminderNote || ''}<br>
                    <input type="file" accept=".pdf,.png,.jpg,.jpeg" onchange="addAttachment(${i}, this)" />
                    <div>${x.attachments.map(a => '📎 ' + a.name).join('<br>')}</div>
                    <textarea id="note${i}" placeholder="Add note"></textarea>
                    <button class="btn" onclick="event.stopPropagation(); addNote(${i})">Save Note</button>
                    ${x.notes.map(n => '<div class="note">' + n.date + '<br>' + n.text + '</div>').join('')}
                  </div>
                </td>
              </tr>
            `;
          });

        t.innerText = tickets.length;
        o.innerText = tickets.filter(x => x.status !== 'Closed').length;
        i.innerText = tickets.filter(x => x.status === 'In Progress').length;
        p.innerText = tickets.filter(x => x.status.includes('Pending')).length;
        c.innerText = tickets.filter(x => x.status === 'Closed').length;
      }

      function exportExcel() {
        let ws = XLSX.utils.json_to_sheet(tickets);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Tickets');
        XLSX.writeFile(wb, 'Tickets_Backup.xlsx');
      }

      function importExcel() {
        let f = excel.files[0];

        if (!f) return;

        let r = new FileReader();

        r.onload = e => {
          let wb = XLSX.read(e.target.result, { type: 'array' });
          tickets = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          save();
          render();
        };

        r.readAsArrayBuffer(f);
      }

      function autoBackup() {
        exportExcel();
      }

      setInterval(autoBackup, 300000);

      function checkReminders() {
        let now = new Date();

        tickets.forEach((r, k) => {
          if (r.reminderDate && !r.reminderDone && new Date(r.reminderDate) <= now && activeReminder === null) {
            activeReminder = k;
            rmText.innerHTML = '<b>' + r.ticketNumber + '</b><br>' + r.reminderNote;
            rm.style.display = 'flex';
          }
        });
      }

      function ackReminder() {
        if (activeReminder !== null) {
          tickets[activeReminder].reminderDone = true;
          save();
        }

        rm.style.display = 'none';
        activeReminder = null;
      }

      setInterval(checkReminders, 30000);
      render();
    </script>
  </body>
</html>
