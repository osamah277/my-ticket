<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TicketDesk V9</title><script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script><style>body{margin:0;font-family:Segoe UI;background:#fff8e7;color:#5b4636}.app{display:flex;height:100vh}.side{width:230px;background:#f4e3b2;padding:15px}.nav{padding:10px;background:#fffdf7;border-radius:8px;margin:6px 0;cursor:pointer}.main{flex:1;display:flex;flex-direction:column}.top{padding:10px;background:#fffdf7;display:flex;gap:10px}.content{display:flex;flex:1}.queue{width:40%;padding:10px;overflow:auto}.details{flex:1;padding:15px;border-left:1px solid #e2c878}.card{background:#fffdf7;border:1px solid #e2c878;border-radius:12px;padding:10px;margin-bottom:10px}.badge{padding:4px 8px;border-radius:10px;color:#fff}.open{background:#1976d2}.assigned{background:#7b1fa2}.progress{background:#f9a825}.pending{background:#ef6c00}.resolved{background:#2e7d32}.closed{background:#616161}input,textarea,select{width:100%;padding:8px;margin:4px 0;box-sizing:border-box}button{background:#c98a00;color:#fff;border:none;padding:8px 12px;border-radius:8px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4)}.panel{background:#fff;width:420px;margin:80px auto;padding:20px;border-radius:12px}</style></head><body><div class='app'><div class='side'><h2>🍯 TicketDesk V9</h2><div class='nav' onclick='setFilter("all")'>All</div><div class='nav' onclick='setFilter("open")'>Open</div><div class='nav' onclick='setFilter("closed")'>Closed</div><div class='nav' onclick='showAdmin()'>Admin</div></div><div class='main'><div class='top'><input id='search' placeholder='Search' onkeyup='render()'><button onclick='exportExcel()'>Export Excel</button></div><div class='content'><div class='queue'><div class='card'><h3>New Ticket</h3><input id='ticketNumber' placeholder='Ticket Number (optional)'><input id='customer' placeholder='Customer'><input id='source' placeholder='Source'><input id='shortdesc' placeholder='Short Description'><textarea id='details'></textarea><button onclick='createTicket()'>Create Ticket</button></div><div id='list'></div></div><div class='details'><h2 id='title'>Select Ticket</h2><div id='detail'>No ticket selected.</div></div></div></div></div><div id='admin' class='modal'><div class='panel'><h3>Admin</h3><input id='pwd' placeholder='Password'><button onclick='loginAdmin()'>Login</button><div id='tools' style='display:none'><input id='deleteId' placeholder='INC000001'><button onclick='deleteById()'>Delete Ticket ID</button><button onclick='deleteClosed()'>Delete Closed</button></div><button onclick='closeAdmin()'>Close</button></div></div><script>let tickets=JSON.parse(localStorage.getItem('tickets_v9')||'[]');let filter='all';function save(){localStorage.setItem('tickets_v9',JSON.stringify(tickets))}function nextId(){let n=parseInt(localStorage.getItem('ticketCounterV9')||'0')+1;localStorage.setItem('ticketCounterV9',n);return 'INC'+String(n).padStart(6,'0')}function createTicket(){let manual=ticketNumber.value.trim();tickets.push({id:manual||nextId(),customer:customer.value,source:source.value,short:shortdesc.value,details:details.value,status:'Open',notes:[]});save();render()}function setFilter(f){filter=f;render()}function cls(s){return s==='Closed'?'closed':'open'}function render(){let q=(search.value||'').toLowerCase();let arr=tickets.filter(t=>(t.id+t.customer).toLowerCase().includes(q));if(filter==='open')arr=arr.filter(t=>t.status!=='Closed');if(filter==='closed')arr=arr.filter(t=>t.status==='Closed');list.innerHTML='';arr.forEach((t,i)=>{let idx=tickets.indexOf(t);list.innerHTML+=`<div class='card' onclick='showTicket(${idx})'><b>${t.id}</b><br>${t.customer}<br><span class='badge ${cls(t.status)}'>${t.status}</span></div>`})}function showTicket(i){let t=tickets[i];title.innerText=t.id;detail.innerHTML=`<b>Customer:</b> ${t.customer}<br><b>Source:</b> ${t.source}<br><b>Description:</b> ${t.short}<br><button onclick='deleteTicket(${i})'>Delete Ticket</button>`}function deleteTicket(i){if(confirm('Delete ticket?')){tickets.splice(i,1);save();render();detail.innerHTML='Deleted';}}function showAdmin(){admin.style.display='block'}function closeAdmin(){admin.style.display='none'}window.onclick=e=>{if(e.target===admin)closeAdmin()}function loginAdmin(){if(pwd.value==='admin123')tools.style.display='block'}function deleteById(){let id=deleteId.value.trim();tickets=tickets.filter(t=>t.id!==id);save();render()}function deleteClosed(){tickets=tickets.filter(t=>t.status!=='Closed');save();render()}function exportExcel(){let ws=XLSX.utils.json_to_sheet(tickets);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tickets');XLSX.writeFile(wb,'Tickets_Backup.xlsx')}render();</script></body></html>
