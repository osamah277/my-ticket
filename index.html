<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket Dashboard V1</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/svg+xml" href="icons/ticket-dashboard.svg">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 20px;
        color: #333;
        background: #f5f7fa;
        font-family: Segoe UI, Arial, sans-serif;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .page-header h1 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0.67em 0;
      }

      .page-logo {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
      }

      .settings-menu {
        position: relative;
      }

      .settings-button {
        padding: 8px 10px;
        border: 1px solid #d3dce6;
        border-radius: 6px;
        color: #333;
        background: #fff;
        font-size: 1.25rem;
        cursor: pointer;
      }

      .settings-panel {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 10;
        min-width: 190px;
        padding: 8px;
        border: 1px solid #d3dce6;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 4px 16px rgb(0 0 0 / 15%);
      }

      .settings-panel button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .settings-panel button:hover,
      .settings-panel button[aria-pressed="true"] {
        background: #e8f2ff;
      }

      .settings-danger-zone {
        margin-top: 8px;
        padding: 8px;
        border-top: 1px solid #d3dce6;
      }

      .settings-danger-zone p {
        margin: 4px 0 8px;
        font-size: 0.8rem;
      }

      .settings-panel .settings-danger-zone button.delete-btn {
        width: 100%;
        margin-top: 6px;
        color: #fff;
        background: #c0392b;
        text-align: center;
      }

      .settings-panel .settings-danger-zone button.delete-btn:hover {
        background: #a93226;
      }

      .delete-confirm-dialog {
        width: min(420px, calc(100% - 32px));
        max-height: 80vh;
        padding: 20px;
        border: 1px solid #d3dce6;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 8px 32px rgb(0 0 0 / 25%);
      }

      .delete-confirm-dialog::backdrop {
        background: rgb(0 0 0 / 45%);
      }

      .delete-confirm-dialog h2 {
        margin-top: 0;
      }

      .delete-confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }

      .delete-confirm-error {
        color: #b42318;
      }

      body.dark-mode {
        color: #e5e7eb;
        background: #171b22;
      }

      .dark-mode .settings-button,
      .dark-mode .settings-panel,
      .dark-mode .card,
      .dark-mode .stat,
      .dark-mode .table,
      .dark-mode .notif-dialog {
        color: #e5e7eb;
        border-color: #3a4351;
        background: #242b36;
      }

      .dark-mode .search-dialog {
        color: #e5e7eb;
        border-color: #3a4351;
        background: #242b36;
      }

      .dark-mode .settings-panel button {
        color: #e5e7eb;
      }

      .dark-mode .delete-confirm-dialog {
        color: #e5e7eb;
        border-color: #3a4351;
        background: #242b36;
      }

      .dark-mode .settings-panel button:hover,
      .dark-mode .settings-panel button[aria-pressed="true"] {
        background: #35465c;
      }

      .dark-mode input,
      .dark-mode textarea,
      .dark-mode select {
        color: #e5e7eb;
        border: 1px solid #485365;
        background: #1c222c;
      }

      .dark-mode input::placeholder,
      .dark-mode textarea::placeholder {
        color: #aab4c2;
      }

      .dark-mode .table th {
        background: #303a49;
      }

      .dark-mode .table th,
      .dark-mode .table td,
      .dark-mode .reminder {
        border-color: #3a4351;
      }

      .dark-mode .table .priority-row-high td {
        color: #fff;
        background: #7f1d1d;
      }

      .dark-mode .table .priority-row-medium td {
        color: #fff;
        background: #854d0e;
      }

      .dark-mode .table .priority-row-low td {
        color: #fff;
        background: #166534;
      }

      .dark-mode .table .priority-row-high:hover td {
        background: #991b1b;
      }

      .dark-mode .table .priority-row-medium:hover td {
        background: #a16207;
      }

      .dark-mode .table .priority-row-low:hover td {
        background: #15803d;
      }

      .dark-mode .table .ticket-row a {
        color: inherit;
      }

      .dark-mode .table.profile-osamah .ticket-row td {
        border-bottom-color: #171b22;
      }

      .dark-mode .detail {
        background: #202733;
      }

      .dark-mode .note {
        background: #303a49;
      }

      .dark-mode .reminder {
        background: #242b36;
      }

      .color-blind-mode .table .priority-row-high td {
        background: #f5d6b8;
      }

      .color-blind-mode .table .priority-row-medium td {
        background: #cfe3f8;
      }

      .color-blind-mode .table .priority-row-low td {
        background: #e2e5e9;
      }

      .color-blind-mode .table .priority-row-high:hover td {
        background: #e9b98e;
      }

      .color-blind-mode .table .priority-row-medium:hover td {
        background: #a9cbea;
      }

      .color-blind-mode .table .priority-row-low:hover td {
        background: #c4cbd3;
      }

      .color-blind-mode .priority-high {
        color: #713b12;
        background: #f5d6b8;
      }

      .color-blind-mode .priority-medium {
        color: #174b78;
        background: #cfe3f8;
      }

      .color-blind-mode .priority-low {
        color: #303943;
        background: #e2e5e9;
      }

      .color-blind-mode .priority-high::before {
        content: "▲ ";
      }

      .color-blind-mode .priority-medium::before {
        content: "■ ";
      }

      .color-blind-mode .priority-low::before {
        content: "● ";
      }

      .dark-mode.color-blind-mode .table .priority-row-high td {
        color: #fff;
        background: #79400f;
      }

      .dark-mode.color-blind-mode .table .priority-row-medium td {
        color: #fff;
        background: #174b78;
      }

      .dark-mode.color-blind-mode .table .priority-row-low td {
        color: #fff;
        background: #414b56;
      }

      .dark-mode.color-blind-mode .table .priority-row-high:hover td {
        background: #9a581e;
      }

      .dark-mode.color-blind-mode .table .priority-row-medium:hover td {
        background: #23689f;
      }

      .dark-mode.color-blind-mode .table .priority-row-low:hover td {
        background: #586574;
      }

      .dark-mode.color-blind-mode .priority-high {
        color: #fff;
        background: #79400f;
      }

      .dark-mode.color-blind-mode .priority-medium {
        color: #fff;
        background: #174b78;
      }

      .dark-mode.color-blind-mode .priority-low {
        color: #fff;
        background: #414b56;
      }

      .card,
      .stat {
        padding: 12px;
        border: 1px solid #d3dce6;
        border-radius: 8px;
        background: #fff;
      }

      .card {
        width: 100%;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }

      .stat-filter {
        width: 100%;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .stat-filter[aria-pressed="true"] {
        border-color: #4a90e2;
        box-shadow: 0 0 0 2px #4a90e2;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        margin: 10px 0;
      }

      input,
      textarea,
      select {
        width: 100%;
        margin: 5px 0;
        padding: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .row > * {
        min-width: 0;
      }

      .btn {
        padding: 10px;
        border: none;
        border-radius: 6px;
        color: #fff;
        background: #4a90e2;
      }

      .delete-btn {
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        color: #fff;
        background: #c0392b;
        cursor: pointer;
      }

      .priority-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .priority-high {
        color: #8f1d14;
        background: #fde8e7;
      }

      .priority-medium {
        color: #755300;
        background: #fff3c4;
      }

      .priority-low {
        color: #176b3a;
        background: #e2f5e9;
      }

      .table .priority-row-high td {
        background: #fff0ef;
      }

      .table .priority-row-medium td {
        background: #fff9e6;
      }

      .table .priority-row-low td {
        background: #edf8f0;
      }

      .table .ticket-row td {
        transition: background-color 150ms ease;
      }

      .table .priority-row-high:hover td {
        background: #eaa09a;
      }

      .table .priority-row-medium:hover td {
        background: #eacb58;
      }

      .table .priority-row-low:hover td {
        background: #8bc49b;
      }

      .table.profile-osamah .ticket-row td {
        border-bottom: 8px solid #f5f7fa;
      }

      .table.profile-steven th:nth-child(6),
      .table.profile-steven td:nth-child(6) {
        display: none;
      }

      .table.profile-steven col:nth-child(6) {
        display: none;
      }

      .position-input {
        width: 4.5em;
        margin: 0;
        text-align: center;
      }

      .ticket-row {
        cursor: grab;
      }

      .ticket-row:active {
        cursor: grabbing;
      }

      .ticket-row-dragging {
        opacity: 0.45;
      }

      .ticket-row-drop-target td {
        border-top: 3px solid #4a90e2;
      }

      .table-container {
        width: 100%;
        overflow-x: hidden;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        background: #fff;
      }

      .table th {
        position: relative;
        background: #dce6f1;
      }

      .column-resizer {
        position: absolute;
        top: 0;
        right: -5px;
        bottom: 0;
        z-index: 1;
        width: 10px;
        cursor: col-resize;
        touch-action: none;
      }

      .column-resizer::after {
        position: absolute;
        top: 20%;
        bottom: 20%;
        left: 4px;
        width: 2px;
        background: transparent;
        content: "";
      }

      .column-resizer:hover::after,
      .column-resizer:focus-visible::after {
        background: #4a90e2;
      }

      .column-resizer:focus-visible {
        outline: 2px solid #4a90e2;
        outline-offset: -2px;
      }

      body.column-resizing {
        cursor: col-resize;
        user-select: none;
      }

      .ticket-tools {
        display: flex;
        justify-content: flex-end;
        margin: 10px 0;
      }

      .search-dialog {
        width: min(600px, calc(100% - 32px));
        max-height: min(80vh, 700px);
        padding: 20px;
        border: 1px solid #d3dce6;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 8px 32px rgb(0 0 0 / 25%);
      }

      .search-dialog::backdrop {
        background: rgb(0 0 0 / 45%);
      }

      .search-dialog-header,
      .search-dialog-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .search-dialog-header h2 {
        margin: 0;
      }

      .search-dialog-close {
        padding: 4px 10px;
        border: 0;
        border-radius: 6px;
        color: inherit;
        background: transparent;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .search-dialog-close:hover {
        background: rgb(127 127 127 / 15%);
      }

      .search-dialog-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 12px 0;
      }

      .search-dialog-grid label {
        min-width: 0;
      }

      .search-dialog-actions {
        justify-content: flex-end;
      }

      .search-clear {
        padding: 10px;
        border: 1px solid #d3dce6;
        border-radius: 6px;
        color: inherit;
        background: transparent;
        cursor: pointer;
      }

      .table th,
      .table td {
        padding: 10px;
        border: 1px solid #d3dce6;
        overflow-wrap: anywhere;
      }

      .detail {
        display: none;
        padding: 10px;
        background: #fafcff;
      }

      .note {
        margin: 4px 0;
        padding: 6px;
        background: #eef4fb;
      }

      .reminder {
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #d3dce6;
        border-radius: 6px;
      }

      .reminder p {
        margin: 4px 0 8px;
      }

      .notif {
        position: fixed;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        inset: 0;
        padding: 20px;
        background: rgb(0 0 0 / 45%);
      }

      .notif-dialog {
        width: min(100%, 420px);
        padding: 10px;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 32px rgb(0 0 0 / 25%);
      }

      .notif-dialog.ticket-reminder {
        border: 3px solid #7c3aed;
        background: #f3e8ff;
      }

      .dark-mode .notif-dialog.ticket-reminder {
        color: #f5f3ff;
        border-color: #a78bfa;
        background: #302542;
      }

      .notif-dialog h2 {
        margin: 0 0 10px;
      }

      .notif-dialog p {
        overflow-wrap: anywhere;
      }

      .notif button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        color: #fff;
        background: #4a90e2;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        body {
          margin: 12px;
        }

        .table th,
        .table td {
          padding: 4px;
          font-size: 0.75rem;
        }

        .position-input {
          width: 100%;
          font-size: 0.75rem;
        }

        .priority-badge {
          padding: 2px 4px;
          white-space: normal;
        }

        .delete-btn {
          padding: 4px;
          font-size: 0.7rem;
        }

        .stats {
          grid-template-columns: repeat(2, 1fr);
        }

        .row,
        .toolbar {
          grid-template-columns: 1fr;
          flex-direction: column;
        }

        .search-dialog-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="n" class="notif">
      <section class="notif-dialog" role="dialog" aria-modal="true" aria-labelledby="notification-title" aria-describedby="notification-message">
        <h2 id="notification-title">Notification</h2>
        <p id="notification-message"></p>
        <button type="button" onclick="dismissNotification()">Okay</button>
      </section>
    </div>
    <main id="app-content">
      <header class="page-header">
        <h1>
          <img class="page-logo" src="icons/ticket-dashboard.svg" alt="">
          Ticket Dashboard V1
        </h1>
        <div class="settings-menu">
          <button
            class="settings-button"
            type="button"
            aria-label="Settings"
            aria-expanded="false"
            aria-controls="settings-panel"
            onclick="toggleSettings()"
          >&#9881;</button>
          <div class="settings-panel" id="settings-panel" hidden>
            <button type="button" id="theme-toggle" aria-pressed="false" onclick="toggleTheme()">
              ☾ Dark mode
            </button>
            <button type="button" id="color-blind-toggle" aria-pressed="false" onclick="toggleColorBlindMode()">
              Color-blind mode: Off
            </button>
            <button type="button" data-profile="osamah" aria-pressed="false" onclick="setProfile('osamah')">
              Osamah Settings
            </button>
            <button type="button" data-profile="steven" aria-pressed="true" onclick="setProfile('steven')">
              Steven Settings (Default)
            </button>
            <section class="settings-danger-zone" aria-label="Ticket deletion">
              <label for="delete-ticket-number">Ticket number to delete</label>
              <input id="delete-ticket-number" type="text" placeholder="Enter ticket number">
              <button type="button" class="delete-btn" onclick="openDeleteConfirmation('one')">
                Delete Ticket
              </button>
              <button type="button" class="delete-btn" onclick="openDeleteConfirmation('all')">
                Delete All Tickets
              </button>
            </section>
          </div>
        </div>
      </header>

      <dialog class="delete-confirm-dialog" id="delete-confirm-dialog" aria-labelledby="delete-confirm-title">
        <h2 id="delete-confirm-title">Confirm Ticket Deletion</h2>
        <p id="delete-confirm-description"></p>
        <label for="delete-confirm-password">Password</label>
        <input id="delete-confirm-password" type="password" autocomplete="current-password">
        <p class="delete-confirm-error" id="delete-confirm-error" role="alert"></p>
        <div class="delete-confirm-actions">
          <button type="button" class="search-clear" onclick="closeDeleteConfirmation()">Cancel</button>
          <button type="button" class="delete-btn" onclick="confirmTicketDeletion()">Confirm Delete</button>
        </div>
      </dialog>

      <div class="stats">
        <button type="button" class="stat stat-filter" data-category="All" aria-pressed="true" onclick="setCategoryFilter('All')">
          Total: <span id="t">0</span>
        </button>
        <button type="button" class="stat stat-filter" data-category="Active" aria-pressed="false" onclick="setCategoryFilter('Active')">
          Active: <span id="o">0</span>
        </button>
        <button type="button" class="stat stat-filter" data-category="In Progress" aria-pressed="false" onclick="setCategoryFilter('In Progress')">
          In Progress: <span id="i">0</span>
        </button>
        <button type="button" class="stat stat-filter" data-category="Pending" aria-pressed="false" onclick="setCategoryFilter('Pending')">
          Pending: <span id="p">0</span>
        </button>
        <button type="button" class="stat stat-filter" data-category="Closed" aria-pressed="false" onclick="setCategoryFilter('Closed')">
          Closed: <span id="c">0</span>
        </button>
      </div>

      <div class="card">
        <h3>Create Ticket</h3>
        <div class="row">
          <input id="tn" placeholder="Ticket Number (leave blank for auto)">
          <input id="cn" placeholder="Customer Name">
        </div>
        <input id="ticket-link" type="url" placeholder="Ticket Link (optional, e.g. https://...)">
        <input id="tf" placeholder="Ticket From">
        <input id="sd" placeholder="Short Description">
        <div class="row">
          <input type="date" id="ad">
          <select id="st">
            <option>Assigned</option>
            <option>In Progress</option>
            <option>Pending Customer</option>
            <option>Pending Vendor</option>
            <option>Resolved</option>
            <option>Closed</option>
          </select>
        </div>
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="High">High (Red)</option>
          <option value="Medium" selected>Medium (Yellow)</option>
          <option value="Low">Low (Green)</option>
        </select>
        <button class="btn" onclick="createTicket()">Create Ticket</button>
      </div>

      <div class="ticket-tools">
        <input
          id="csv-file"
          type="file"
          accept=".csv,text/csv"
          hidden
          onchange="importTicketsFromCsv(event)"
        >
        <button class="btn" type="button" onclick="document.getElementById('csv-file').click()">
          Import CSV
        </button>
        <button class="btn" type="button" onclick="openTicketSearch()">Search and filter tickets</button>
      </div>
      <dialog class="search-dialog" id="ticket-search-dialog" aria-labelledby="ticket-search-title">
        <div class="search-dialog-header">
          <h2 id="ticket-search-title">Search and filter tickets</h2>
          <button class="search-dialog-close" type="button" aria-label="Close search" onclick="closeTicketSearch()">&#215;</button>
        </div>
        <div class="search-dialog-grid">
          <label for="filter-ticket-number">
            Ticket number
            <input id="filter-ticket-number" aria-label="Search by ticket number" placeholder="Search ticket number...">
          </label>
          <label for="filter-customer">
            Customer name
            <input id="filter-customer" aria-label="Search by customer name" placeholder="Search customer name...">
          </label>
          <label for="filter-last-updated">
            Last updated date
            <input id="filter-last-updated" type="date" aria-label="Filter by last updated date">
          </label>
          <label for="filter-status">
            Status
            <select id="filter-status" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option>Assigned</option>
              <option>In Progress</option>
              <option>Pending Customer</option>
              <option>Pending Vendor</option>
              <option>Resolved</option>
              <option>Closed</option>
            </select>
          </label>
          <label for="filter-priority">
            Priority
            <select id="filter-priority" aria-label="Filter by priority">
              <option value="">All priorities</option>
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </label>
          <label for="filter-ticket-from">
            Ticket source
            <select id="filter-ticket-from" aria-label="Filter by ticket source">
              <option value="">All sources</option>
              <option value="AM">AM</option>
              <option value="PS">PS</option>
            </select>
          </label>
          <label for="sort-tickets">
            Sort tickets
            <select id="sort-tickets" aria-label="Sort tickets">
              <option value="">Manual order</option>
              <option value="newest">Last updated: newest to oldest</option>
              <option value="oldest">Last updated: oldest to newest</option>
              <option value="customer-asc">Customer: A to Z</option>
              <option value="customer-desc">Customer: Z to A</option>
            </select>
          </label>
        </div>
        <div class="search-dialog-actions">
          <button class="search-clear" type="button" onclick="clearTicketSearch()">Clear filters</button>
          <button class="btn" type="button" onclick="applyTicketSearch()">Done</button>
        </div>
      </dialog>
      <div class="table-container">
        <table class="table profile-steven" id="ticket-table">
          <colgroup>
            <col data-column-key="order">
            <col data-column-key="ticket-number">
            <col data-column-key="customer">
            <col data-column-key="status">
            <col data-column-key="priority">
            <col data-column-key="ticket-from">
            <col data-column-key="last-updated">
            <col data-column-key="description">

    <script>
      localStorage.removeItem("ticket_dashboard_delete_password");
      const storageKey = "tickets_v4";
      const profileStorageKey = "ticket_dashboard_profile";
      const themeStorageKey = "ticket_dashboard_theme";
      const colorBlindStorageKey = "ticket_dashboard_color_blind";
      const columnWidthsStorageKey = "ticket_dashboard_column_widths";
      const ticketDeletionPassword = "240926";
      const defaultTicketLink = "https://hicclicc-smartit.ca.onbmc.com/smartit/app/#/ticket-consoleStudio";
      const hourlyReminderInterval = 60 * 60 * 1000;
      const reminderInterval = 24 * 60 * 60 * 1000;
      const resolvedClosureInterval = 7 * 24 * 60 * 60 * 1000;
      const ticketPageSize = 20;
      const minimumColumnWidth = 90;
      const defaultColumnWidths = [90, 110, 150, 140, 110, 120, 140, 320];
      let preferredColumnWidths = {};
      let activeProfile = localStorage.getItem(profileStorageKey) === "osamah" ? "osamah" : "steven";
      let activeTheme = localStorage.getItem(themeStorageKey) === "dark" ? "dark" : "light";
      let colorBlindMode = localStorage.getItem(colorBlindStorageKey) === "on";
      let activeCategory = "All";
      let visibleTicketLimit = ticketPageSize;
      let appliedTicketSearch = {
        ticketNumber: "",
        customer: "",
        lastUpdated: "",
        status: "",
        priority: "",
        ticketFrom: "",
        sort: "",
      };
      let notificationQueue = [];
      let previousFocus = null;
      let draggedTicket = null;
      let pendingTicketDeletion = null;
      let needsTicketMigrationSave = false;
      let tickets = JSON.parse(localStorage.getItem(storageKey) || "[]")
        .map((ticket) => {
          const cleanedTicket = stripLegacyReminderFields(ticket);
          if (!Array.isArray(cleanedTicket.notes)) {
            cleanedTicket.notes = [];
            needsTicketMigrationSave = true;
          }
          if (cleanedTicket.status === "Open") cleanedTicket.status = "Assigned";
          if (!["High", "Medium", "Low"].includes(cleanedTicket.priority)) {
            cleanedTicket.priority = "Medium";
          }
          const lastUpdateAt = Date.parse(cleanedTicket.lastUpdateAt);
          const legacyLastUpdateAt = Date.parse(cleanedTicket.lastUpdate);
          const normalizedLastUpdateAt = Number.isNaN(lastUpdateAt)
            ? Number.isNaN(legacyLastUpdateAt) ? Date.now() : legacyLastUpdateAt
            : lastUpdateAt;
          cleanedTicket.lastUpdateAt = new Date(normalizedLastUpdateAt).toISOString();
          if (cleanedTicket.status === "Resolved") {
            if (Number.isNaN(Date.parse(cleanedTicket.resolvedAt))) {
              cleanedTicket.resolvedAt = new Date(normalizedLastUpdateAt).toISOString();
              needsTicketMigrationSave = true;
            }
          } else if (cleanedTicket.resolvedAt) {
            delete cleanedTicket.resolvedAt;
            needsTicketMigrationSave = true;
          }
          if (Number.isNaN(Date.parse(cleanedTicket.nextHourlyReminderAt))) {
            cleanedTicket.nextHourlyReminderAt = new Date(
              normalizedLastUpdateAt + hourlyReminderInterval
            ).toISOString();
          }
          if (
            needsStatusReminder(cleanedTicket.status) &&
            Number.isNaN(Date.parse(cleanedTicket.nextStatusReminderAt))
          ) {
            cleanedTicket.nextStatusReminderAt = new Date(Date.now() + reminderInterval).toISOString();
          }
          if (
            cleanedTicket.ticketReminderAt &&
            Number.isNaN(Date.parse(cleanedTicket.ticketReminderAt))
          ) {
            delete cleanedTicket.ticketReminderAt;
          }
          return cleanedTicket;
        });

      if (needsTicketMigrationSave) save();

      function stripLegacyReminderFields(ticket) {
        const cleanedTicket = { ...ticket };
        delete cleanedTicket.reminderDate;
        delete cleanedTicket.reminderNote;
        delete cleanedTicket.reminderDone;
        return cleanedTicket;
      }

      function save() {
        localStorage.setItem(storageKey, JSON.stringify(tickets));
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = "";
        let inQuotes = false;

        for (let index = 0; index < text.length; index += 1) {
          const character = text[index];
          if (inQuotes) {
            if (character === '"' && text[index + 1] === '"') {
              field += '"';
              index += 1;
            } else if (character === '"') {
              inQuotes = false;
            } else {
              field += character;
            }
          } else if (character === '"' && field.length === 0) {
            inQuotes = true;
          } else if (character === ",") {
            row.push(field);
            field = "";
          } else if (character === "\n" || character === "\r") {
            row.push(field);
            if (row.some((value) => value.trim() !== "")) rows.push(row);
            row = [];
            field = "";
            if (character === "\r" && text[index + 1] === "\n") index += 1;
          } else {
            field += character;
          }
        }

        if (inQuotes) throw new Error("The CSV contains an unclosed quoted field.");
        row.push(field);
        if (row.some((value) => value.trim() !== "")) rows.push(row);
        return rows;
      }

      function normalizeCsvHeader(header) {
        return header.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function importTicketsFromCsv(event) {
        const fileInput = event.currentTarget;
        const file = fileInput.files[0];
        if (!file) return;

        file.text().then((text) => {
          const rows = parseCsv(text.replace(/^\uFEFF/, ""));
          if (rows.length < 2) throw new Error("The CSV must include a header row and at least one ticket.");

          const headers = rows[0].map(normalizeCsvHeader);
          const findColumn = (...names) => headers.findIndex((header) => names.includes(header));
          const ticketNumberColumn = findColumn("displayid", "tasknumber", "ticketnumber");
          const priorityColumn = findColumn("priority");
          if (ticketNumberColumn < 0 || priorityColumn < 0) {
            throw new Error("CSV headers must include DisplayID (task number) and Priority.");
          }

          const descriptionColumn = findColumn("summary", "summry", "description", "shortdescription");
          const customerColumn = findColumn("customerfullname", "customername", "custmerfullname");
          const statusColumn = findColumn("status", "stats");
          const modifiedColumn = findColumn("lastmodified", "lastupdated", "lastupdate");
          const knownNumbers = new Set(tickets.map((ticket) => ticket.ticketNumber));
          let importedCount = 0;
          let skippedCount = 0;
          const errors = [];

          rows.slice(1).forEach((values, rowIndex) => {
            const ticketNumber = (values[ticketNumberColumn] || "").trim();
            const priorityValue = (values[priorityColumn] || "").trim().toLowerCase();
            const priority = ["high", "medium", "low"].includes(priorityValue)
              ? priorityValue[0].toUpperCase() + priorityValue.slice(1)
              : "";
            const statusValue = statusColumn < 0 ? "" : (values[statusColumn] || "").trim();
            const status = statusValue
              ? statusValue.toLowerCase() === "open"
                ? "Assigned"
                : statusValue.toLowerCase() === "staged"
                  ? "Pending Vendor"
                : ["pending", "pinding"].includes(statusValue.toLowerCase())
                  ? "Pending Customer"
                : ["Assigned", "In Progress", "Pending Customer", "Pending Vendor", "Resolved", "Closed"]
                  .find((value) => value.toLowerCase() === statusValue.toLowerCase())
              : "Assigned";

            if (!ticketNumber || !priority || !status || knownNumbers.has(ticketNumber)) {
              skippedCount += 1;
              if (!ticketNumber) errors.push(`Row ${rowIndex + 2}: missing DisplayID.`);
              else if (!priority) errors.push(`Row ${rowIndex + 2}: Priority must be High, Medium, or Low.`);
              else if (!status) errors.push(`Row ${rowIndex + 2}: unsupported Status "${statusValue}".`);
              else errors.push(`Row ${rowIndex + 2}: duplicate DisplayID "${ticketNumber}".`);
              return;
            }

            const modifiedValue = modifiedColumn < 0 ? "" : (values[modifiedColumn] || "").trim();
            const modifiedAt = modifiedValue ? Date.parse(modifiedValue) : Date.now();
            if (!Number.isFinite(modifiedAt)) {
              skippedCount += 1;
              errors.push(`Row ${rowIndex + 2}: invalid Last Modified date "${modifiedValue}".`);
              return;
            }

            const updatedAt = new Date(modifiedAt);
            const updatedAtIso = updatedAt.toISOString();
            const ticket = {
              ticketNumber,
              ticketLink: "",
              customerName: customerColumn < 0 ? "" : (values[customerColumn] || "").trim(),
              ticketFrom: "",
              shortDescription: descriptionColumn < 0 ? "" : (values[descriptionColumn] || "").trim(),
              assignedDate: "",
              status,
              priority,
              createdAt: updatedAtIso,
              lastUpdateAt: updatedAtIso,
              lastUpdate: formatLastUpdate(updatedAt),
              nextHourlyReminderAt: new Date(Date.now() + hourlyReminderInterval).toISOString(),
              notes: [],
            };
            if (status === "Resolved") ticket.resolvedAt = updatedAtIso;
            if (needsStatusReminder(status)) {
              ticket.nextStatusReminderAt = new Date(Date.now() + reminderInterval).toISOString();
            }
            tickets.push(ticket);
            knownNumbers.add(ticketNumber);
            importedCount += 1;
          });

          if (importedCount) {
            save();
            visibleTicketLimit = Math.max(visibleTicketLimit, tickets.length);
            render();
          }
          const result = `Imported ${importedCount} ticket${importedCount === 1 ? "" : "s"}.`
            + (skippedCount ? ` Skipped ${skippedCount} row${skippedCount === 1 ? "" : "s"}.` : "");
          pop(errors.length ? `${result} ${errors.slice(0, 3).join(" ")}` : result);
        }).catch((error) => {
          pop(`Could not import CSV: ${error.message}`);
        }).finally(() => {
          fileInput.value = "";
        });
      }

      function updateTableWidth() {
        const table = document.getElementById("ticket-table");
        const containerWidth = table.parentElement.clientWidth;
        const headers = table.querySelectorAll("thead tr:first-child th");
        const columns = table.querySelectorAll("colgroup col");
        const visibleIndices = [...headers]
          .map((header, index) => getComputedStyle(header).display !== "none" ? index : -1)
          .filter((index) => index >= 0);
        const minimumWidth = Math.min(minimumColumnWidth, containerWidth / visibleIndices.length);
        const assignedWidths = new Map();
        let remainingIndices = [...visibleIndices];
        let remainingWidth = containerWidth;

        while (remainingIndices.length) {
          const totalPreferredWidth = remainingIndices.reduce(
            (total, index) => total + preferredColumnWidths[columns[index].dataset.columnKey],
            0
          );
          const tooNarrow = remainingIndices.filter((index) =>
            remainingWidth * preferredColumnWidths[columns[index].dataset.columnKey] / totalPreferredWidth < minimumWidth
          );

          if (!tooNarrow.length) {
            remainingIndices.forEach((index) => {
              assignedWidths.set(
                index,
                remainingWidth * preferredColumnWidths[columns[index].dataset.columnKey] / totalPreferredWidth
              );
            });
            break;
          }

          tooNarrow.forEach((index) => {
            assignedWidths.set(index, minimumWidth);
            remainingWidth -= minimumWidth;
          });
          remainingIndices = remainingIndices.filter((index) => !tooNarrow.includes(index));
        }

        columns.forEach((column, index) => {
          column.style.width = assignedWidths.has(index)
            ? `${assignedWidths.get(index) / containerWidth * 100}%`
            : "0";
        });
        table.style.width = "100%";
      }

      function saveColumnWidths() {
        localStorage.setItem(columnWidthsStorageKey, JSON.stringify(preferredColumnWidths));
      }

      function getResizeNeighbor(index, visibleIndices) {
        const visiblePosition = visibleIndices.indexOf(index);
        return visibleIndices[visiblePosition + 1] ?? visibleIndices[visiblePosition - 1];
      }

      function syncVisibleColumnWidths(visibleIndices) {
        const columns = document.querySelectorAll("#ticket-table colgroup col");
        visibleIndices.forEach((index) => {
          preferredColumnWidths[columns[index].dataset.columnKey] =
            columns[index].getBoundingClientRect().width;
        });
      }

      function resizeColumn(index, neighborIndex, width, neighborWidth) {
        const columns = document.querySelectorAll("#ticket-table colgroup col");
        preferredColumnWidths[columns[index].dataset.columnKey] = width;
        preferredColumnWidths[columns[neighborIndex].dataset.columnKey] = neighborWidth;
        updateTableWidth();
        return columns[index].getBoundingClientRect().width;
      }

      function initializeColumnResizing() {
        const table = document.getElementById("ticket-table");
        const columns = [...table.querySelectorAll("colgroup col")];
        const headers = [...table.querySelectorAll("thead tr:first-child th")];
        const savedWidths = JSON.parse(localStorage.getItem(columnWidthsStorageKey) || "{}");

        columns.forEach((column, index) => {
          const savedWidth = Number(savedWidths[column.dataset.columnKey]);
          preferredColumnWidths[column.dataset.columnKey] = Number.isFinite(savedWidth) && savedWidth > 0
            ? savedWidth
            : defaultColumnWidths[index];

          const handle = document.createElement("span");
          handle.className = "column-resizer";
          handle.setAttribute("role", "separator");
          handle.setAttribute("aria-orientation", "vertical");
          handle.setAttribute("aria-label", `Resize ${headers[index].textContent.trim()} column`);
          handle.setAttribute("aria-valuemin", String(minimumColumnWidth));
          handle.setAttribute("tabindex", "0");
          handle.title = "Drag to resize, or focus and use the arrow keys";

          handle.addEventListener("pointerdown", (event) => {
            if (event.button !== 0) return;

            const visibleIndices = headers
              .map((header, headerIndex) => getComputedStyle(header).display !== "none" ? headerIndex : -1)
              .filter((headerIndex) => headerIndex >= 0);
            const neighborIndex = getResizeNeighbor(index, visibleIndices);
            if (neighborIndex === undefined) return;

            event.preventDefault();
            syncVisibleColumnWidths(visibleIndices);
            const startX = event.clientX;
            const startWidth = columns[index].getBoundingClientRect().width;
            const startNeighborWidth = columns[neighborIndex].getBoundingClientRect().width;
            const pointerId = event.pointerId;
            handle.setPointerCapture(pointerId);
            document.body.classList.add("column-resizing");

            const onPointerMove = (moveEvent) => {
              if (moveEvent.pointerId !== pointerId) return;
              const minimumWidth = Math.min(minimumColumnWidth, table.parentElement.clientWidth / visibleIndices.length);
              const delta = Math.max(
                minimumWidth - startWidth,
                Math.min(startNeighborWidth - minimumWidth, moveEvent.clientX - startX)
              );
              const width = resizeColumn(
                index,
                neighborIndex,
                startWidth + delta,
                startNeighborWidth - delta
              );
              handle.setAttribute("aria-valuenow", String(Math.round(width)));
            };

            const onPointerEnd = (endEvent) => {
              if (endEvent.pointerId !== pointerId) return;
              handle.removeEventListener("pointermove", onPointerMove);
              handle.removeEventListener("pointerup", onPointerEnd);
              handle.removeEventListener("pointercancel", onPointerEnd);
              document.body.classList.remove("column-resizing");
              saveColumnWidths();
            };

            handle.addEventListener("pointermove", onPointerMove);
            handle.addEventListener("pointerup", onPointerEnd);
            handle.addEventListener("pointercancel", onPointerEnd);
          });

          handle.addEventListener("keydown", (event) => {
            if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
            const visibleIndices = headers
              .map((header, headerIndex) => getComputedStyle(header).display !== "none" ? headerIndex : -1)
              .filter((headerIndex) => headerIndex >= 0);
            const neighborIndex = getResizeNeighbor(index, visibleIndices);
            if (neighborIndex === undefined) return;

            event.preventDefault();
            syncVisibleColumnWidths(visibleIndices);
            const startWidth = columns[index].getBoundingClientRect().width;
            const startNeighborWidth = columns[neighborIndex].getBoundingClientRect().width;
            const minimumWidth = Math.min(minimumColumnWidth, table.parentElement.clientWidth / visibleIndices.length);
            const amount = event.shiftKey ? 20 : 10;
            const delta = Math.max(
              minimumWidth - startWidth,
              Math.min(
                startNeighborWidth - minimumWidth,
                event.key === "ArrowRight" ? amount : -amount
              )
            );
            const width = resizeColumn(
              index,
              neighborIndex,
              startWidth + delta,
              startNeighborWidth - delta
            );
            handle.setAttribute("aria-valuenow", String(Math.round(width)));
            saveColumnWidths();
          });

          headers[index].append(handle);
        });

        updateTableWidth();
        window.addEventListener("resize", updateTableWidth);
      }

      save();

      function needsStatusReminder(status) {
        return status === "Assigned" || status === "In Progress";
      }

      function toggleSettings() {
        const panel = document.getElementById("settings-panel");
        const isOpen = panel.hidden;
        panel.hidden = !isOpen;
        document.querySelector(".settings-button").setAttribute("aria-expanded", String(isOpen));
      }

      function toggleTheme() {
        setTheme(activeTheme === "light" ? "dark" : "light");
      }

      function setTheme(theme) {
        activeTheme = theme;
        localStorage.setItem(themeStorageKey, theme);
        document.body.classList.toggle("dark-mode", theme === "dark");
        const themeToggle = document.getElementById("theme-toggle");
        const isDark = theme === "dark";
        themeToggle.textContent = isDark ? "☀ Light mode" : "☾ Dark mode";
        themeToggle.setAttribute("aria-pressed", String(isDark));
      }

      function toggleColorBlindMode() {
        colorBlindMode = !colorBlindMode;
        localStorage.setItem(colorBlindStorageKey, colorBlindMode ? "on" : "off");
        document.body.classList.toggle("color-blind-mode", colorBlindMode);
        const toggle = document.getElementById("color-blind-toggle");
        toggle.textContent = `Color-blind mode: ${colorBlindMode ? "On" : "Off"}`;
        toggle.setAttribute("aria-pressed", String(colorBlindMode));
      }

      function setProfile(profile) {
        if (profile !== "osamah" && profile !== "steven") return;
        activeProfile = profile;
        localStorage.setItem(profileStorageKey, profile);
        document.getElementById("settings-panel").hidden = true;
        document.querySelector(".settings-button").setAttribute("aria-expanded", "false");
        render();
      }

      function pop(message, linkedTickets = [], type = "default") {
        const notification = { message, linkedTickets, type };
        if (document.getElementById("n").style.display === "flex") {
          notificationQueue.push(notification);
          return;
        }

        previousFocus = document.activeElement;
        showNotification(notification);
      }

      function showNotification(notification) {
        document.querySelector(".notif-dialog").classList.toggle(
          "ticket-reminder",
          notification.type === "ticket-reminder"
        );
        const messageElement = document.getElementById("notification-message");
        messageElement.replaceChildren();
        const ticketsByNumber = new Map(
          notification.linkedTickets.map((ticket) => [ticket.ticketNumber, ticket])
        );
        const ticketNumbers = [...ticketsByNumber.keys()]
          .sort((left, right) => right.length - left.length)
          .map((ticketNumber) => ticketNumber.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));

        if (ticketNumbers.length) {
          const ticketNumberPattern = new RegExp(`(${ticketNumbers.join("|")})`, "g");
          let previousIndex = 0;
          for (const match of notification.message.matchAll(ticketNumberPattern)) {
            const ticketNumber = match[0];
            const matchIndex = match.index;
            messageElement.append(
              document.createTextNode(notification.message.slice(previousIndex, matchIndex))
            );

            const link = document.createElement("a");
            link.href = getTicketLink(ticketsByNumber.get(ticketNumber));
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = ticketNumber;
            link.addEventListener("click", (event) => event.stopPropagation());
            messageElement.append(link);
            previousIndex = matchIndex + ticketNumber.length;
          }
          messageElement.append(document.createTextNode(notification.message.slice(previousIndex)));
        } else {
          messageElement.textContent = notification.message;
        }

        document.getElementById("app-content").inert = true;
        document.getElementById("n").style.display = "flex";
        document.querySelector(".notif-dialog button").focus();
      }

      function dismissNotification() {
        if (notificationQueue.length > 0) {
          showNotification(notificationQueue.shift());
          return;
        }

        document.getElementById("n").style.display = "none";
        document.getElementById("app-content").inert = false;
        if (previousFocus instanceof HTMLElement && previousFocus.isConnected) {
          previousFocus.focus();
        }
        previousFocus = null;
      }

      function openDeleteConfirmation(type) {
        if (type === "all") {
          if (tickets.length === 0) {
            pop("There are no tickets to delete.");
            return;
          }
          pendingTicketDeletion = { type };
          document.getElementById("delete-confirm-title").textContent = "Delete All Tickets";
          document.getElementById("delete-confirm-description").textContent =
            `This will permanently delete all ${tickets.length} tickets.`;
        } else {
          const ticketNumber = document.getElementById("delete-ticket-number").value.trim();
          if (!ticketNumber) {
            pop("Enter a ticket number to delete.");
            return;
          }
          if (!tickets.some((ticket) => ticket.ticketNumber === ticketNumber)) {
            pop(`Ticket ${ticketNumber} was not found.`);
            return;
          }
          pendingTicketDeletion = { type: "one", ticketNumber };
          document.getElementById("delete-confirm-title").textContent = "Delete Ticket";
          document.getElementById("delete-confirm-description").textContent =
            `This will permanently delete ticket ${ticketNumber}.`;
        }

        document.getElementById("delete-confirm-password").value = "";
        document.getElementById("delete-confirm-error").textContent = "";
        document.getElementById("delete-confirm-dialog").showModal();
      }

      function closeDeleteConfirmation() {
        pendingTicketDeletion = null;
        document.getElementById("delete-confirm-password").value = "";
        document.getElementById("delete-confirm-error").textContent = "";
        document.getElementById("delete-confirm-dialog").close();
      }

      function confirmTicketDeletion() {
        const password = document.getElementById("delete-confirm-password").value;
        if (password !== ticketDeletionPassword) {
          document.getElementById("delete-confirm-error").textContent = "Incorrect password.";
          return;
        }
        if (!pendingTicketDeletion) {
          closeDeleteConfirmation();
          return;
        }

        if (pendingTicketDeletion.type === "all") {
          if (!confirm(`Delete all ${tickets.length} tickets? This cannot be undone.`)) return;
          tickets.length = 0;
          visibleTicketLimit = ticketPageSize;
          save();
          render();
          closeDeleteConfirmation();
          document.getElementById("delete-ticket-number").value = "";
          pop("All tickets deleted.");
          return;
        }

        const ticketIndex = tickets.findIndex(
          (ticket) => ticket.ticketNumber === pendingTicketDeletion.ticketNumber
        );
        if (ticketIndex < 0) {
          closeDeleteConfirmation();
          pop("That ticket no longer exists.");
          return;
        }
        const ticketNumber = tickets[ticketIndex].ticketNumber;
        if (!confirm(`Delete ticket ${ticketNumber}? This cannot be undone.`)) return;
        tickets.splice(ticketIndex, 1);
        save();
        render();
        closeDeleteConfirmation();
        document.getElementById("delete-ticket-number").value = "";
        pop(`Ticket ${ticketNumber} deleted.`);
      }

      function checkHourlyReminder() {
        const now = new Date();
        if (now.getHours() < 7 || now.getHours() > 15) return;

        const dueTickets = [];
        let reminderScheduleChanged = false;
        tickets.forEach((ticket) => {
          if (ticket.status === "Closed") return;

          let nextReminder = Date.parse(ticket.nextHourlyReminderAt);
          if (Number.isNaN(nextReminder)) {
            nextReminder = Date.parse(ticket.lastUpdateAt) + hourlyReminderInterval;
          }
          if (Number.isNaN(nextReminder) || nextReminder > now.getTime()) return;

          if (ticket.ticketReminderAt) {
            do {
              nextReminder += hourlyReminderInterval;
            } while (nextReminder <= now.getTime());
            ticket.nextHourlyReminderAt = new Date(nextReminder).toISOString();
            reminderScheduleChanged = true;
            return;
          }

          dueTickets.push(ticket);
          do {
            nextReminder += hourlyReminderInterval;
          } while (nextReminder <= now.getTime());
          ticket.nextHourlyReminderAt = new Date(nextReminder).toISOString();
        });

        if (reminderScheduleChanged || dueTickets.length) save();
        if (dueTickets.length) {
          const ticketNumbers = dueTickets.map((ticket) => ticket.ticketNumber).join(", ");
          pop(`Hourly reminder: check tickets not updated in the last hour ${ticketNumbers}`, dueTickets);
        }
      }

      function nextId() {
        let id = tickets.length + 1;
        let ticketNumber = `INC${String(id).padStart(6, "0")}`;
        while (hasTicketNumber(ticketNumber)) {
          id += 1;
          ticketNumber = `INC${String(id).padStart(6, "0")}`;
        }
        return ticketNumber;
      }

      function hasTicketNumber(ticketNumber) {
        const normalizedTicketNumber = ticketNumber.trim().toLowerCase();
        return tickets.some(
          (ticket) => ticket.ticketNumber.trim().toLowerCase() === normalizedTicketNumber
        );
      }

      function normalizeTicketLink(value) {
        if (typeof value !== "string") return "";
        const link = value.trim();
        if (!link) return "";

        try {
          const url = new URL(link);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
        } catch {
          return null;
        }
      }

      function getTicketLink(ticket) {
        return normalizeTicketLink(ticket.ticketLink) || defaultTicketLink;
      }

      function escapeAttribute(value) {
        return value.replace(/[&"<>']/g, (character) => ({
          "&": "&amp;",
          '"': "&quot;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
        })[character]);
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"]/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
        })[character]);
      }

      function createTicket() {
        const enteredTicketNumber = document.getElementById("tn").value.trim();
        const ticketNumber = enteredTicketNumber || nextId();
        if (hasTicketNumber(ticketNumber)) {
          pop("A ticket with this number already exists");
          return;
        }

        const ticketLink = normalizeTicketLink(document.getElementById("ticket-link").value);
        if (ticketLink === null) {
          pop("Enter a valid ticket link starting with http:// or https://");
          return;
        }

        const createdAt = new Date();
        const ticket = {
          ticketNumber,
          ticketLink,
          customerName: document.getElementById("cn").value,
          ticketFrom: document.getElementById("tf").value,
          shortDescription: document.getElementById("sd").value,
          assignedDate: document.getElementById("ad").value,
          status: document.getElementById("st").value,
          priority: document.getElementById("priority").value,
          createdAt: createdAt.toISOString(),
          lastUpdateAt: createdAt.toISOString(),
          lastUpdate: formatLastUpdate(createdAt),
          nextHourlyReminderAt: new Date(createdAt.getTime() + hourlyReminderInterval).toISOString(),
          notes: [],
        };
        if (ticket.status === "Resolved") ticket.resolvedAt = createdAt.toISOString();
        if (needsStatusReminder(ticket.status)) {
          ticket.nextStatusReminderAt = new Date(Date.now() + reminderInterval).toISOString();
        }

        tickets.push(ticket);
        save();
        ["tn", "cn", "ticket-link", "tf", "sd", "ad"].forEach((id) => {
          document.getElementById(id).value = "";
        });
        document.getElementById("st").value = "Assigned";
        document.getElementById("priority").value = "Medium";
        render();
        pop("Ticket Created");
      }

      function toggle(index) {
        const detail = document.getElementById(`d${index}`);
        const detailRow = document.getElementById(`detail-row-${index}`);
        const isOpen = !detailRow.hidden;
        detailRow.hidden = isOpen;
        detail.style.display = isOpen ? "none" : "block";
      }

      function updateLastUpdate(index) {
        const now = Date.now();
        const previous = Date.parse(tickets[index].lastUpdateAt);
        const updatedAt = Number.isFinite(previous) ? Math.max(now, previous + 1000) : now;
        tickets[index].lastUpdateAt = new Date(updatedAt).toISOString();
        tickets[index].lastUpdate = formatLastUpdate(new Date(updatedAt));
        tickets[index].nextHourlyReminderAt =
          new Date(updatedAt + hourlyReminderInterval).toISOString();
      }

      function formatLastUpdate(date) {
        return date.toLocaleString(undefined, {
          year: "numeric",
          month: "numeric",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      function openTicket(event, index) {
        event.stopPropagation();
        if (isTicketLocked(tickets[index])) return;
        updateLastUpdate(index);
        save();
        document.getElementById(`last-update-${index}`).textContent = tickets[index].lastUpdate;
      }

      function getNoteTimestamp(note) {
        if (typeof note?.timestamp === "number" && Number.isFinite(note.timestamp)) {
          return note.timestamp;
        }
        const parsedDate = Date.parse(note?.date || "");
        return Number.isFinite(parsedDate) ? parsedDate : 0;
      }

      function sortNotesNewestFirst(notes) {
        return [...notes].sort((left, right) => getNoteTimestamp(right) - getNoteTimestamp(left));
      }

      function addNote(index) {
        if (isTicketLocked(tickets[index])) return;
        const noteInput = document.getElementById(`note${index}`);
        const text = noteInput.value.trim();
        if (!text) return;

        const now = Date.now();
        tickets[index].notes.push({
          date: new Date(now).toLocaleString(),
          timestamp: now,
          text,
        });
        updateLastUpdate(index);
        save();
        render();
      }

      function statusChange(index, status) {
        const ticket = tickets[index];
        if (isTicketLocked(ticket) || ticket.status === status) return;
        const changedAt = new Date();
        ticket.status = status;
        updateLastUpdate(index);
        ticket.notes.push({
          date: changedAt.toLocaleString(),
          timestamp: changedAt.getTime(),
          text: `Status changed to "${status}"`,
        });
        if (status === "Resolved") {
          ticket.resolvedAt = changedAt.toISOString();
        } else {
          delete ticket.resolvedAt;
        }
        if (needsStatusReminder(status)) {
          ticket.nextStatusReminderAt = new Date(Date.now() + reminderInterval).toISOString();
        } else {
          delete ticket.nextStatusReminderAt;
        }
        save();
        render();
      }

      function checkResolvedTickets() {
        const now = Date.now();
        const closedTickets = [];

        tickets.forEach((ticket, index) => {
          if (ticket.status !== "Resolved") return;
          const resolvedAt = Date.parse(ticket.resolvedAt);
          if (!Number.isFinite(resolvedAt) || resolvedAt + resolvedClosureInterval > now) return;

          ticket.status = "Closed";
          ticket.notes.push({
            date: new Date(now).toLocaleString(),
            timestamp: now,
            text: 'Status changed to "Closed" automatically after one week in Resolved',
          });
          delete ticket.resolvedAt;
          delete ticket.nextStatusReminderAt;
          updateLastUpdate(index);
          closedTickets.push(ticket);
        });

        if (closedTickets.length) {
          save();
          render();
          const ticketNumbers = closedTickets.map((ticket) => ticket.ticketNumber).join(", ");
          pop(
            `Automatically closed ${closedTickets.length === 1 ? "ticket" : "tickets"}: ${ticketNumbers}`,
            closedTickets
          );
        }
      }

      function priorityChange(index, priority) {
        if (isTicketLocked(tickets[index])) return;
        if (tickets[index].priority === priority) return;
        if (!["High", "Medium", "Low"].includes(priority)) {
          pop("Choose a valid ticket priority");
          render();
          return;
        }

        tickets[index].priority = priority;
        updateLastUpdate(index);
        save();
        render();
      }

      function priorityClass(priority) {
        return `priority-${priority.toLowerCase()}`;
      }

      function checkStatusReminders() {
        const now = Date.now();
        const dueTickets = [];

        tickets.forEach((ticket) => {
          if (!needsStatusReminder(ticket.status)) return;

          let nextReminder = Date.parse(ticket.nextStatusReminderAt);
          if (Number.isNaN(nextReminder)) {
            nextReminder = now + reminderInterval;
          } else if (nextReminder <= now) {
            dueTickets.push(ticket);
            do {
              nextReminder += reminderInterval;
            } while (nextReminder <= now);
          } else {
            return;
          }

          ticket.nextStatusReminderAt = new Date(nextReminder).toISOString();
        });

        if (dueTickets.length) {
          save();
          const ticketNumbers = dueTickets.map((ticket) => ticket.ticketNumber).join(", ");
          pop(`Reminder: ${ticketNumbers} ${dueTickets.length === 1 ? "is" : "are"} still Assigned or In Progress`, dueTickets);
        }
      }

      function setTicketReminder(index) {
        const ticket = tickets[index];
        if (ticket && isTicketLocked(ticket)) return;
        if (!ticket || ticket.ticketReminderAt) {
          pop("This ticket already has an active reminder");
          return;
        }

        const reminderInput = document.getElementById(`reminder${index}`);
        const reminderTime = Date.parse(reminderInput.value);
        if (!reminderInput.value || Number.isNaN(reminderTime) || reminderTime <= Date.now()) {
          pop("Choose a reminder time in the future");
          return;
        }

        ticket.ticketReminderAt = new Date(reminderTime).toISOString();
        save();
        render();
        document.getElementById(`detail-row-${index}`).hidden = false;
        document.getElementById(`d${index}`).style.display = "block";
        pop(`Reminder set for ticket ${ticket.ticketNumber}`, [ticket], "ticket-reminder");
      }

      function cancelTicketReminder(index) {
        const ticket = tickets[index];
        if (!ticket || isTicketLocked(ticket)) return;
        delete ticket.ticketReminderAt;
        save();
        render();
      }

      function formatCountdown(milliseconds) {
        const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `${hours}h ${minutes}m ${seconds}s`;
      }

      function updateReminderCountdowns() {
        document.querySelectorAll("[data-reminder-at]").forEach((element) => {
          const reminderTime = Date.parse(element.dataset.reminderAt);
          element.textContent = `Reminder in ${formatCountdown(reminderTime - Date.now())}`;
        });
      }

      function checkTicketReminders() {
        const now = Date.now();
        const dueTickets = [];

        tickets.forEach((ticket) => {
          if (!ticket.ticketReminderAt || Date.parse(ticket.ticketReminderAt) > now) return;
          dueTickets.push(ticket);
          delete ticket.ticketReminderAt;
        });

        if (dueTickets.length) {
          save();
          render();
          const ticketNumbers = dueTickets.map((ticket) => ticket.ticketNumber).join(", ");
          pop(`Reminder: ${ticketNumbers}`, dueTickets, "ticket-reminder");
        }
      }

      function setCategoryFilter(category) {
        activeCategory = category;
        resetTicketList();
      }

      function openTicketSearch() {
        const dialog = document.getElementById("ticket-search-dialog");
        if (dialog.open) return;
        dialog.showModal();
        document.getElementById("filter-ticket-number").focus();
      }

      function closeTicketSearch() {
        document.getElementById("ticket-search-dialog").close();
      }

      function clearTicketSearch() {
        [
          "filter-ticket-number",
          "filter-customer",
          "filter-last-updated",
          "filter-status",
          "filter-priority",
          "filter-ticket-from",
          "sort-tickets",
        ].forEach((id) => {
          document.getElementById(id).value = "";
        });
      }

      function applyTicketSearch() {
        appliedTicketSearch = {
          ticketNumber: document.getElementById("filter-ticket-number").value.trim().toLowerCase(),
          customer: document.getElementById("filter-customer").value.trim().toLowerCase(),
          lastUpdated: document.getElementById("filter-last-updated").value,
          status: document.getElementById("filter-status").value,
          priority: document.getElementById("filter-priority").value,
          ticketFrom: document.getElementById("filter-ticket-from").value,
          sort: document.getElementById("sort-tickets").value,
        };
        closeTicketSearch();
        resetTicketList();
      }

      function resetTicketList() {
        visibleTicketLimit = ticketPageSize;
        render();
      }

      function loadMoreTickets() {
        visibleTicketLimit += ticketPageSize;
        render();
      }

      function isClosedCategoryStatus(status) {
        return status === "Closed" || status === "Resolved";
      }

      function isTicketLocked(ticket) {
        if (ticket.status === "Closed") return true;
        if (ticket.status !== "Resolved") return false;
        const resolvedAt = Date.parse(ticket.resolvedAt);
        return Number.isFinite(resolvedAt) && resolvedAt + resolvedClosureInterval <= Date.now();
      }

      function matchesCategory(ticket) {
        if (activeCategory === "Active") return !isClosedCategoryStatus(ticket.status);
        if (activeCategory === "In Progress") return ticket.status === "In Progress";
        if (activeCategory === "Pending") return ticket.status.includes("Pending");
        if (activeCategory === "Closed") return isClosedCategoryStatus(ticket.status);
        return true;
      }

      function formatDate(value, options) {
        if (!value) return "—";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "—" : date.toLocaleString(undefined, options);
      }

      function matchesLocalDate(value, dateValue) {
        if (!dateValue) return true;
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return false;

        const localDateValue = [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0"),
        ].join("-");
        return localDateValue === dateValue;
      }

      function getVisibleTickets() {
        const visibleTickets = tickets.filter((ticket) =>
          ticket.ticketNumber.toLowerCase().includes(appliedTicketSearch.ticketNumber) &&
          (ticket.customerName || "").toLowerCase().includes(appliedTicketSearch.customer) &&
          (!appliedTicketSearch.status || ticket.status === appliedTicketSearch.status) &&
          (!appliedTicketSearch.priority || ticket.priority === appliedTicketSearch.priority) &&
          (!appliedTicketSearch.ticketFrom ||
            (ticket.ticketFrom || "").trim().toUpperCase() === appliedTicketSearch.ticketFrom) &&
          matchesLocalDate(ticket.lastUpdateAt, appliedTicketSearch.lastUpdated) &&
          matchesCategory(ticket)
        );

        if (appliedTicketSearch.sort === "newest" || appliedTicketSearch.sort === "oldest") {
          const direction = appliedTicketSearch.sort === "newest" ? -1 : 1;
          visibleTickets.sort((left, right) =>
            direction * (Date.parse(left.lastUpdateAt) - Date.parse(right.lastUpdateAt))
          );
        } else if (
          appliedTicketSearch.sort === "customer-asc" ||
          appliedTicketSearch.sort === "customer-desc"
        ) {
          const direction = appliedTicketSearch.sort === "customer-asc" ? 1 : -1;
          visibleTickets.sort((left, right) =>
            direction * (left.customerName || "").localeCompare(
              right.customerName || "",
              undefined,
              { sensitivity: "base" }
            )
          );
        }

        return visibleTickets;
      }

      function moveTicketToPosition(index, requestedPosition) {
        const ticket = tickets[index];
        if (!ticket || isTicketLocked(ticket)) return;

        const visibleTickets = getVisibleTickets();
        const currentPosition = visibleTickets.indexOf(tickets[index]);
        const position = Number(requestedPosition);
        if (!Number.isInteger(position) || position < 1 || position > visibleTickets.length) {
          pop(`Enter a position from 1 to ${visibleTickets.length}`);
          render();
          return;
        }

        const targetPosition = Math.min(position, visibleTickets.length) - 1;
        if (currentPosition < 0 || targetPosition === currentPosition) return;

        const targetTicket = visibleTickets[targetPosition];
        tickets.splice(index, 1);
        const targetIndex = tickets.indexOf(targetTicket);
        const insertionIndex = targetIndex + (currentPosition < targetPosition ? 1 : 0);
        tickets.splice(insertionIndex, 0, ticket);
        save();
        render();
      }

      function startTicketDrag(event, index) {
        if (isTicketLocked(tickets[index])) return;
        draggedTicket = tickets[index];
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", draggedTicket.ticketNumber);
        event.currentTarget.classList.add("ticket-row-dragging");
      }

      function dragOverTicket(event) {
        if (!draggedTicket) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        event.currentTarget.classList.add("ticket-row-drop-target");
      }

      function endTicketDrag() {
        draggedTicket = null;
        document.querySelectorAll(".ticket-row-dragging, .ticket-row-drop-target")
          .forEach((row) => row.classList.remove("ticket-row-dragging", "ticket-row-drop-target"));
      }

      function dropTicket(event, targetIndex) {
        event.preventDefault();
        const targetTicket = tickets[targetIndex];
        if (isTicketLocked(targetTicket)) {
          endTicketDrag();
          return;
        }
        if (!draggedTicket || draggedTicket === targetTicket) {
          endTicketDrag();
          return;
        }

        const visibleTickets = getVisibleTickets();
        const draggedPosition = visibleTickets.indexOf(draggedTicket);
        const targetPosition = visibleTickets.indexOf(targetTicket);
        if (draggedPosition < 0 || targetPosition < 0) {
          endTicketDrag();
          return;
        }

        const row = event.currentTarget;
        const isAfter = event.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
        let destinationPosition = targetPosition + (isAfter ? 1 : 0);
        if (draggedPosition < destinationPosition) destinationPosition -= 1;

        moveTicketToPosition(tickets.indexOf(draggedTicket), destinationPosition + 1);
        endTicketDrag();
      }

      function render() {
        const visibleTickets = getVisibleTickets();
        const isSorted = appliedTicketSearch.sort !== "";

        document.getElementById("ticket-table").className = `table profile-${activeProfile}`;
        updateTableWidth();
        document.querySelectorAll(".settings-panel [data-profile]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.profile === activeProfile));
        });

        document.querySelectorAll(".stat-filter").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.category === activeCategory));
        });

        const ticketList = document.getElementById("list");
        ticketList.innerHTML = "";

        const ticketsToRender = visibleTickets.slice(0, visibleTicketLimit);
        document.getElementById("load-more-container").hidden =
          visibleTickets.length <= visibleTicketLimit;

        ticketsToRender.forEach((ticket, visiblePosition) => {
          const index = tickets.indexOf(ticket);
          const ticketLink = getTicketLink(ticket);
          const isLocked = isTicketLocked(ticket);
          ticketList.innerHTML += `
            <tr
              class="ticket-row priority-row-${ticket.priority.toLowerCase()}"
              draggable="${!isSorted && !isLocked}"
              ondragstart="startTicketDrag(event, ${index})"
              ondragover="dragOverTicket(event)"
              ondragleave="event.currentTarget.classList.remove('ticket-row-drop-target')"
              ondrop="dropTicket(event, ${index})"
              ondragend="endTicketDrag()"
              onclick="toggle(${index})"
            >
              <td>
                <input
                  class="position-input"
                  type="number"
                  min="1"
                  max="${visibleTickets.length}"
                  value="${visiblePosition + 1}"
                  ${isSorted || isLocked ? "disabled" : ""}
                  aria-label="Position for ticket ${escapeAttribute(ticket.ticketNumber)}"
                  title="1 is the top; ${visibleTickets.length} moves to the bottom"
                  onchange="event.stopPropagation(); moveTicketToPosition(${index}, this.value)"
                  onclick="event.stopPropagation()"
                >
              </td>
              <td>${ticketLink
                ? `<a href="${escapeAttribute(ticketLink)}" target="_blank" rel="noopener noreferrer" onclick="openTicket(event, ${index})">${escapeHtml(ticket.ticketNumber)}</a>`
                : escapeHtml(ticket.ticketNumber)}</td>
              <td>${escapeHtml(ticket.customerName || "")}</td>
              <td>${escapeHtml(ticket.status || "")}</td>
              <td><span class="priority-badge ${priorityClass(ticket.priority)}">${ticket.priority}</span></td>
              <td>${escapeHtml(ticket.ticketFrom || "—")}</td>
              <td id="last-update-${index}">${escapeHtml(ticket.lastUpdate || "—")}</td>
              <td>${escapeHtml(ticket.shortDescription || "")}</td>
            </tr>
            <tr id="detail-row-${index}" hidden>
              <td colspan="${activeProfile === "steven" ? 7 : 8}">
                <div class="detail" id="d${index}">
                  <select onchange="statusChange(${index}, this.value)" ${isLocked ? "disabled" : ""}>
                    <option selected>${ticket.status}</option>
                    <option>Assigned</option>
                    <option>In Progress</option>
                    <option>Pending Customer</option>
                    <option>Pending Vendor</option>
                    <option>Resolved</option>
                    <option>Closed</option>
                  </select>
                  <label for="ticket-priority-${index}">Priority</label>
                  <select id="ticket-priority-${index}" onchange="priorityChange(${index}, this.value)" ${isLocked ? "disabled" : ""}>
                    <option value="High" ${ticket.priority === "High" ? "selected" : ""}>High (Red)</option>
                    <option value="Medium" ${ticket.priority === "Medium" ? "selected" : ""}>Medium (Yellow)</option>
                    <option value="Low" ${ticket.priority === "Low" ? "selected" : ""}>Low (Green)</option>
                  </select>
                  <textarea
                    id="note${index}"
                    placeholder="${isLocked ? "Comments cannot be added to locked tickets" : "Add note"}"
                    ${isLocked ? "disabled" : ""}
                  ></textarea>
                  <button class="btn" onclick="event.stopPropagation(); addNote(${index})" ${isLocked ? "disabled" : ""}>
                    Save Note
                  </button>
                  ${sortNotesNewestFirst(ticket.notes).map((note) => `
                    <div class="note">${note.date}<br>${note.text}</div>
                  `).join("")}
                  <div class="reminder">
                    ${
                      ticket.ticketReminderAt
                        ? `
                          <p data-reminder-at="${ticket.ticketReminderAt}">
                            Reminder in ${formatCountdown(Date.parse(ticket.ticketReminderAt) - Date.now())}
                          </p>
                          <button class="delete-btn" onclick="event.stopPropagation(); cancelTicketReminder(${index})" ${isLocked ? "disabled" : ""}>
                            Cancel Reminder
                          </button>
                        `
                        : `
                          <label for="reminder${index}">Set a ticket reminder</label>
                          <input
                            id="reminder${index}"
                            type="datetime-local"
                            min="${toLocalDateTimeValue(new Date())}"
                            ${isLocked ? "disabled" : ""}
                          >
                          <button class="btn" onclick="event.stopPropagation(); setTicketReminder(${index})" ${isLocked ? "disabled" : ""}>
                            Set Reminder
                          </button>
                        `
                    }
                  </div>
                </div>
              </td>
            </tr>
          `;
        });

        document.getElementById("t").innerText = tickets.length;
        document.getElementById("o").innerText =
          tickets.filter((ticket) => !isClosedCategoryStatus(ticket.status)).length;
        document.getElementById("i").innerText =
          tickets.filter((ticket) => ticket.status === "In Progress").length;
        document.getElementById("p").innerText =
          tickets.filter((ticket) => ticket.status.includes("Pending")).length;
        document.getElementById("c").innerText =
          tickets.filter((ticket) => isClosedCategoryStatus(ticket.status)).length;
      }

      function toLocalDateTimeValue(date) {
        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60 * 1000);
        return localDate.toISOString().slice(0, 16);
      }

      checkStatusReminders();
      setInterval(checkStatusReminders, 60 * 1000);
      checkResolvedTickets();
      setInterval(checkResolvedTickets, 60 * 1000);
      checkTicketReminders();
      setInterval(() => {
        checkTicketReminders();
        updateReminderCountdowns();
      }, 1000);
      checkHourlyReminder();
      setInterval(checkHourlyReminder, 15 * 1000);
      setTheme(activeTheme);
      document.body.classList.toggle("color-blind-mode", colorBlindMode);
      document.getElementById("color-blind-toggle").textContent =
        `Color-blind mode: ${colorBlindMode ? "On" : "Off"}`;
      document.getElementById("color-blind-toggle").setAttribute("aria-pressed", String(colorBlindMode));
      initializeColumnResizing();
      render();
    </script>
  </body>
</html>
