<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>TicketDesk V7</title><script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script>
<style>
body{margin:0;font-family:Segoe UI;background:#fff8e7;color:#5b4636} .app{display:flex;height:100vh}
.sidebar{width:220px;background:#f4e3b2;padding:20px}.sidebar h2{margin-top:0}
.sidebar div{padding:10px;border-radius:8px;margin:6px 0;background:#fffdf7}
.main{flex:1;display:flex;flex-direction:column}.top{padding:12px;background:#fffdf7;border-bottom:1px solid #e2c878;display:flex;gap:10px}
.content{display:flex;flex:1}.list{width:45%;padding:15px;overflow:auto}.details{flex:1;padding:15px;border-left:1px solid #e2c878;overflow:auto}
.card{background:#fffdf7;border:1px solid #e2c878;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.badge{padding:4px 8px;border-radius:20px;color:#fff}.open{background:#1976d2}.assigned{background:#7b1fa2}.progress{background:#f9a825}.pending{background:#ef6c00}.resolved{background:#2e7d32}.closed{background:#616161}
input,textarea,select{width:100%;padding:10px;margin:5px 0;box-sizing:border-box;border:1px solid #e2c878;border-radius:8px} button{background:#c98a00;color:#fff;border:none;padding:10px 14px;border-radius:8px}
.note{background:#faf0d7;padding:8px;margin:5px 0;border-radius:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4)} .panel{background:white;width:420px;margin:80px auto;padding:20px;border-radius:12px}
</style></head><body><div class='app'><div class='sidebar'><h2>🍯 TicketDesk</h2><div>Dashboard</div><div>Open Tickets</div><div>Pending</div><div>Resolved</div><div>Closed</div><div>🔔 Reminders <span id='remindersCount'>0</span></div><div onclick='showAdmin()'>⚙️ Admin</div></div><div class='main'><div class='top'><input id='search' placeholder='Search tickets' onkeyup='renderList()'><button onclick='exportExcel()'>Export Excel</button></div><div class='content'><div class='list'><div class='card'><h3>New Ticket</h3><input id='customer' placeholder='Customer Name'><input id='source' placeholder='Ticket Source'><input id='shortdesc' placeholder='Short Description'><textarea id='detailsTxt' placeholder='Ticket Details'></textarea><button onclick='createTicket()'>Create Ticket</button></div><div id='ticketList'></div></div><div class='details'><h2 id='title'>Select a ticket</h2><div id='detailPane'>Choose a ticket from the left panel.</div></div></div></div></div>
<div id='admin' class='modal'><div class='panel'><h3>Admin Panel</h3><input id='adminPwd' placeholder='Password'><button onclick='loginAdmin()'>Login</button><div id='adminArea' style='display:none'><button onclick='deleteClosed()'>Delete Closed Tickets</button></div></div></div>
<div id='remModal' class='modal'><div class='panel'><h3>🔔 Reminder</h3><div id='remText'></div><button onclick='ackReminder()'>OK</button></div></div>
<script>
let tickets=JSON.parse(localStorage.getItem('tickets_v7')||'[]');let current=-1,activeReminder=null;
function save(){localStorage.setItem('tickets_v7',JSON.stringify(tickets))}
function id(){return 'INC'+Date.now().toString().slice(-6)}
function createTicket(){tickets.push({id:id(),customer:customer.value,source:source.value,short:shortdesc.value,details:detailsTxt.value,status:'Open',notes:[],reminderDate:'',reminderNote:'',reminderDone:false});save();renderList();}
function cls(s){if(s=='Open')return'open';if(s=='Assigned')return'assigned';if(s=='In Progress')return'progress';if(s.includes('Pending'))return'pending';if(s=='Resolved')return'resolved';return'closed'}
function renderList(){let s=(search.value||'').toLowerCase();ticketList.innerHTML='';tickets.filter(t=>t.id.toLowerCase().includes(s)||t.customer.toLowerCase().includes(s)).forEach((t,i)=>{ticketList.innerHTML+=`<div class='card' onclick='showTicket(${i})'><b>${t.id}</b><br>${t.short}<br><span class='badge ${cls(t.status)}'>${t.status}</span></div>`});remindersCount.innerText=tickets.filter(x=>x.reminderDate&&!x.reminderDone).length;}
function showTicket(i){current=i;let t=tickets[i];title.innerText=t.id;detailPane.innerHTML=`Customer: ${t.customer}<br><br>Source: ${t.source}<br><br><select id='st' onchange='updateStatus(${i})'><option ${t.status=='Open'?'selected':''}>Open</option><option ${t.status=='Assigned'?'selected':''}>Assigned</option><option ${t.status=='In Progress'?'selected':''}>In Progress</option><option ${t.status=='Pending Customer'?'selected':''}>Pending Customer</option><option ${t.status=='Pending Vendor'?'selected':''}>Pending Vendor</option><option ${t.status=='Resolved'?'selected':''}>Resolved</option><option ${t.status=='Closed'?'selected':''}>Closed</option></select><br><br><textarea id='n'></textarea><button onclick='addNote(${i})'>Save Note</button><br><br><input type='datetime-local' id='rd' value='${t.reminderDate||''}'><input id='rn' value='${t.reminderNote||''}' placeholder='Reminder Note'><button onclick='saveReminder(${i})'>Save Reminder</button><button onclick='deleteTicket(${i})'>Delete Ticket</button><h3>Notes</h3>${t.notes.map(x=>`<div class='note'>${x.date}<br>${x.text}</div>`).join('')}`;}
function updateStatus(i){tickets[i].status=st.value;save();renderList();showTicket(i)}
function addNote(i){let v=document.getElementById('n').value;if(!v)return;tickets[i].notes.push({date:new Date().toLocaleString(),text:v});save();showTicket(i)}
function saveReminder(i){tickets[i].reminderDate=rd.value;tickets[i].reminderNote=rn.value;tickets[i].reminderDone=false;save();renderList();}
function deleteTicket(i){if(confirm('Delete ticket?')){tickets.splice(i,1);save();renderList();detailPane.innerHTML='Ticket deleted';}}
function exportExcel(){let ws=XLSX.utils.json_to_sheet(tickets);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tickets');XLSX.writeFile(wb,'Tickets_Backup.xlsx');}
function showAdmin(){admin.style.display='block'} function loginAdmin(){if(adminPwd.value==='admin123')adminArea.style.display='block'} function deleteClosed(){tickets=tickets.filter(t=>t.status!=='Closed');save();renderList();}
function check(){let now=new Date();for(let i=0;i<tickets.length;i++){let t=tickets[i];if(t.reminderDate&&!t.reminderDone&&new Date(t.reminderDate)<=now){activeReminder=i;remText.innerHTML='<b>'+t.id+'</b><br>'+t.reminderNote;remModal.style.display='block';break;}}}
function ackReminder(){if(activeReminder!=null){tickets[activeReminder].reminderDone=true;save()}remModal.style.display='none';activeReminder=null}
setInterval(check,30000);renderList();
</script></body></html>
