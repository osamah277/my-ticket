<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Ticket Dashboard V4 Reminder Fix</title><script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script><style>body{font-family:Segoe UI,Arial;background:#f5f7fa;margin:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d3dce6;padding:10px}th{background:#dce6f1}.detail{display:none;background:#fafcff;padding:10px}.btn{background:#4a90e2;color:#fff;border:none;padding:8px 12px;border-radius:6px}.note{background:#eef4fb;padding:6px;margin:4px 0}</style></head><body><h1>Ticket Dashboard V4 + Reminder Fix</h1><input id='search' placeholder='Search Ticket' onkeyup='render()'><button class='btn' onclick='exportExcel()'>Export Excel</button><div><input id='tn' placeholder='Ticket Number'><input id='cn' placeholder='Customer Name'><input id='tf' placeholder='Ticket From'><input id='sd' placeholder='Short Description'><textarea id='td' placeholder='Ticket Detail'></textarea><button class='btn' onclick='createTicket()'>Create Ticket</button></div><table><thead><tr><th>Ticket</th><th>Customer</th><th>Status</th><th>Description</th></tr></thead><tbody id='list'></tbody></table><script>let tickets=JSON.parse(localStorage.getItem('tickets_v4_fix')||'[]');function save(){localStorage.setItem('tickets_v4_fix',JSON.stringify(tickets))}function createTicket(){tickets.push({ticketNumber:tn.value||('INC'+Date.now().toString().slice(-6)),customerName:cn.value,ticketFrom:tf.value,shortDescription:sd.value,ticketDetail:td.value,status:'Open',reminderDate:'',reminderNote:'',reminderDone:false,notes:[]});save();render()}function toggle(i){let d=document.getElementById('d'+i);d.style.display=d.style.display==='block'?'none':'block'}function saveReminder(i){tickets[i].reminderDate=document.getElementById('reminderDate'+i).value;tickets[i].reminderNote=document.getElementById('reminderNote'+i).value;tickets[i].reminderDone=false;save();render()}function addNote(i){let v=document.getElementById('note'+i).value;if(!v)return;tickets[i].notes.push({date:new Date().toLocaleString(),text:v});save();render()}function render(){let s=(search.value||'').toLowerCase();list.innerHTML='';tickets.filter(t=>t.ticketNumber.toLowerCase().includes(s)).forEach((t,i)=>{list.innerHTML+=`<tr onclick='toggle(${i})'><td>${t.ticketNumber}</td><td>${t.customerName}</td><td>${t.status}</td><td>${t.shortDescription}</td></tr><tr><td colspan='4'><div id='d${i}' class='detail'><b>Ticket Detail:</b> ${t.ticketDetail}<br><b>Ticket From:</b> ${t.ticketFrom}<br><h4>Reminder</h4><input type='datetime-local' id='reminderDate${i}' value='${t.reminderDate||''}'><input id='reminderNote${i}' value='${t.reminderNote||''}' placeholder='Reminder Note'><button class='btn' onclick='event.stopPropagation();saveReminder(${i})'>Save Reminder</button><textarea id='note${i}' placeholder='Add note'></textarea><button class='btn' onclick='event.stopPropagation();addNote(${i})'>Save Note</button>${t.notes.map(n=>`<div class="note">${n.date}<br>${n.text}</div>`).join('')}</div></td></tr>`})}function exportExcel(){let ws=XLSX.utils.json_to_sheet(tickets);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tickets');XLSX.writeFile(wb,'Tickets_Backup.xlsx')}render();</script></body></html>
