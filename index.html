<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Ticket Dashboard V6</title>
<script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script>
<style>
body{font-family:Segoe UI;background:#FFF8E7;margin:20px;color:#5b4636}
.card,.stat{background:#FFFCF3;border:1px solid #E2C878;border-radius:12px;padding:15px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea,select{width:100%;padding:10px;border:1px solid #E2C878;border-radius:8px;box-sizing:border-box;margin-top:5px}
button{background:#C98A00;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{padding:10px;border:1px solid #E2C878}.table th{background:#F6E7B0}
.detail{display:none;padding:12px;background:#FFFCF3}.badge{padding:4px 8px;border-radius:12px;color:#fff}.open{background:#1976d2}.assigned{background:#7b1fa2}.progress{background:#f9a825}.pending{background:#ef6c00}.resolved{background:#2e7d32}.closed{background:#616161}
#admin,#reminderModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4)} .panel{background:white;width:420px;margin:80px auto;padding:20px;border-radius:12px}
</style></head><body>
<h1>🍯 Ticket Dashboard V6</h1>
<div class='grid'><div class='stat'>Total <span id='total'>0</span></div><div class='stat'>Open <span id='openCount'>0</span></div><div class='stat'>Pending <span id='pendingCount'>0</span></div><div class='stat'>Closed <span id='closedCount'>0</span></div><div class='stat'>🔔 <span id='remCount'>0</span></div></div>
<div class='card'>
<h3>Create Ticket</h3>
<div class='row'><input id='customer' placeholder='Customer Name'><input id='from' placeholder='Ticket From'></div>
<input id='short' placeholder='Short Description'>
<textarea id='detail' placeholder='Ticket Detail'></textarea>
<div class='row'><select id='status'><option>Open</option><option>Assigned</option><option>In Progress</option><option>Pending Customer</option><option>Pending Vendor</option><option>Resolved</option><option>Closed</option></select><input type='datetime-local' id='rdate'></div>
<input id='rnote' placeholder='Reminder Note'>
<button onclick='createTicket()'>Create Ticket</button>
<button onclick='exportExcel()'>Export Excel</button>
<button onclick='showAdmin()'>🔧 Admin</button>
</div>
<table class='table'><thead><tr><th>Ticket</th><th>Customer</th><th>Status</th><th>Description</th></tr></thead><tbody id='list'></tbody></table>
<div id='admin'><div class='panel'><h3>Admin Panel</h3><input id='adminPass' placeholder='Password'><button onclick='loginAdmin()'>Login</button><div id='adminTools' style='display:none'><button onclick='deleteClosed()'>Delete Closed Tickets</button></div><button onclick="document.getElementById('admin').style.display='none'">Close</button></div></div>
<div id='reminderModal'><div class='panel'><h3>🔔 Reminder</h3><div id='remText'></div><button onclick='ackReminder()'>OK</button></div></div>
<script>
let tickets=JSON.parse(localStorage.getItem('tickets_v6')||'[]');let activeReminder=null;
function save(){localStorage.setItem('tickets_v6',JSON.stringify(tickets))}
function ticketId(){return 'INC'+String(Date.now()).slice(-6)}
function createTicket(){tickets.push({id:ticketId(),customer:customer.value,from:document.getElementById('from').value,short:short.value,detail:detail.value,status:status.value,reminderDate:rdate.value,reminderNote:rnote.value,reminderDone:false,notes:[]});save();render();}
function badge(s){if(s=='Open')return 'open';if(s=='Assigned')return 'assigned';if(s=='In Progress')return 'progress';if(s.includes('Pending'))return 'pending';if(s=='Resolved')return 'resolved';return 'closed';}
function toggle(i){let d=document.getElementById('d'+i);d.style.display=d.style.display==='block'?'none':'block';}
function addNote(i){let n=document.getElementById('note'+i).value;if(!n)return;tickets[i].notes.push({date:new Date().toLocaleString(),text:n});save();render();}
function saveReminder(i){tickets[i].reminderDate=document.getElementById('rd'+i).value;tickets[i].reminderNote=document.getElementById('rn'+i).value;tickets[i].reminderDone=false;save();render();}
function deleteTicket(i){if(confirm('Delete ticket?')){tickets.splice(i,1);save();render();}}
function render(){list.innerHTML='';tickets.forEach((t,i)=>{list.innerHTML+=`<tr onclick='toggle(${i})'><td>${t.id}</td><td>${t.customer}</td><td><span class='badge ${badge(t.status)}'>${t.status}</span></td><td>${t.short}</td></tr><tr><td colspan='4'><div id='d${i}' class='detail'><b>Details:</b> ${t.detail}<br><br><input id='rd${i}' type='datetime-local' value='${t.reminderDate||""}'><input id='rn${i}' value='${t.reminderNote||""}' placeholder='Reminder Note'><button onclick='event.stopPropagation();saveReminder(${i})'>Save Reminder</button><button onclick='event.stopPropagation();deleteTicket(${i})'>Delete Ticket</button><textarea id='note${i}' placeholder='Add note'></textarea><button onclick='event.stopPropagation();addNote(${i})'>Save Note</button>${t.notes.map(n=>`<div>${n.date}<br>${n.text}</div>`).join('')}</div></td></tr>`});total.innerText=tickets.length;openCount.innerText=tickets.filter(x=>x.status!='Closed').length;pendingCount.innerText=tickets.filter(x=>x.status.includes('Pending')).length;closedCount.innerText=tickets.filter(x=>x.status=='Closed').length;remCount.innerText=tickets.filter(x=>x.reminderDate&&!x.reminderDone).length;}
function exportExcel(){let ws=XLSX.utils.json_to_sheet(tickets);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tickets');XLSX.writeFile(wb,'Tickets_Backup.xlsx');}
function showAdmin(){admin.style.display='block'}
function loginAdmin(){if(adminPass.value==='admin123')adminTools.style.display='block';}
function deleteClosed(){tickets=tickets.filter(t=>t.status!=='Closed');save();render();}
function check(){let now=new Date();for(let i=0;i<tickets.length;i++){let t=tickets[i];if(t.reminderDate&&!t.reminderDone&&new Date(t.reminderDate)<=now){activeReminder=i;remText.innerHTML='<b>'+t.id+'</b><br>'+t.reminderNote;reminderModal.style.display='block';break;}}}
function ackReminder(){if(activeReminder!==null){tickets[activeReminder].reminderDone=true;save();}reminderModal.style.display='none';activeReminder=null;}
setInterval(check,30000);render();
</script></body></html>
